<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Now</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Weather Now</h1>

    <div class="search">
      <input type="text" id="cityInput" placeholder="Enter a city, e.g. Jorhat" aria-label="City name" autocomplete="off">
      <button id="searchBtn" type="button">Get weather</button>
    </div>

    <p id="message" class="message" role="status">Type a city name to see its current weather.</p>

    <section id="result" class="result" hidden>
      <p class="place" id="place"></p>
      <p class="temp"><span id="temp"></span><sup>°C</sup></p>
      <p class="condition" id="condition"></p>

      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Rain now</dt><dd id="rain"></dd></div>
      </dl>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
